# Publicação na Netlify — o jogo E as contas/salvamentos rodam aqui dentro.
#   • o jogo é o site estático em dist/;
#   • as rotas /api/* são atendidas por uma Netlify Function (netlify/functions/api.mts),
#     que guarda contas, sessões e salvamentos em Netlify Blobs (sem servidor sempre ligado e sem banco pago).
#
# E-mail (opcional): sem SMTP, os links de confirmação e de redefinição de senha aparecem no log da função.
# Para enviar de verdade, defina as variáveis SMTP_* e MAIL_FROM nas configurações do site (escopo Functions).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Aplicativo de página única: rotas desconhecidas caem no index.html.
# A função (/api/*) e os arquivos que existem (jogo, ícones, sw.js) têm prioridade sobre esta regra.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Arquivos com hash no nome podem ser guardados para sempre pelo navegador.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O service worker nunca é guardado em cache, para a atualização chegar rápido.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Cabeçalhos de segurança dos arquivos estáticos (as respostas da função definem os seus próprios).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://upload.wikimedia.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
