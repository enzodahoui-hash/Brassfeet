# Exemplo: docker compose up -d   (ajuste BASE_URL e o SMTP)
services:
  jogo:
    build: .
    ports:
      - "8080:8080"
    environment:
      BASE_URL: "https://seu-dominio.com.br"
      # SMTP_HOST: "smtp.seu-provedor.com"
      # SMTP_PORT: "587"
      # SMTP_USER: "usuario"
      # SMTP_PASS: "senha"
      # MAIL_FROM: "Football Manager BR <no-reply@seu-dominio.com.br>"
      # REQUIRE_EMAIL_VERIFICATION: "1"
      TRUST_PROXY: "1"
    volumes:
      - dados:/data
    restart: unless-stopped
volumes:
  dados:
